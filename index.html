<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Personal AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .ai-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        h1 {
            color: #1a1f36;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #697386;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #3c4257;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #a3acb9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.15s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #635bff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #635bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover {
            background-color: #0a2540;
        }
        .status {
            display: none;
            text-align: center;
            color: #635bff;
            font-weight: 600;
            margin-top: 15px;
        }
        .response-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 4px solid #635bff;
            border-radius: 8px;
            line-height: 1.6;
        }
        .clear-btn {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .clear-btn span {
            font-size: 0.85rem;
            color: #d9383a;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="ai-card">
    <h1>My Personal AI</h1>
    <div class="subtitle">Cloud Hosted Engine — Zero Setup Required</div>

    <div class="input-group">
        <label for="apiKeyField">🔑 Google Gemini API Key</label>
        <input type="password" id="apiKeyField" placeholder="Paste your free API key here...">
        <p style="font-size: 0.8rem; color: #697386; margin-top: 5px;">
            Get a free key from <a href="https://google.com" target="_blank">Google AI Studio</a>. It saves securely in your browser.
        </p>
    </div>

    <div class="clear-btn">
        <span id="clearKeyLink">Clear Saved Key</span>
    </div>

    <div class="input-group">
        <label for="aiQuestion">❓ What is your question?</label>
        <textarea id="aiQuestion" rows="4" placeholder="Ask anything. The AI will search web sources to answer..."></textarea>
    </div>

    <button id="submitBtn">Ask My AI</button>

    <div id="statusMessage" class="status">⚡ Connection secure. Sourcing information...</div>
    <div id="outputBlock" class="response-container"></div>
</div>

<script>
    // Load previously saved key on page load
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("personal_ai_key");
        if (savedKey) {
            document.getElementById("apiKeyField").value = savedKey;
        }
    });

    // Clear saved key function
    document.getElementById("clearKeyLink").addEventListener("click", () => {
        localStorage.removeItem("personal_ai_key");
        document.getElementById("apiKeyField").value = "";
        alert("Saved API key removed!");
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
        const apiKey = document.getElementById("apiKeyField").value.trim();
        const question = document.getElementById("aiQuestion").value.trim();
        const statusBox = document.getElementById("statusMessage");
        const outputBox = document.getElementById("outputBlock");

        if (!apiKey || !question) {
            alert("Please fill in both the API Key and your Question.");
            return;
        }

        // Save key locally for next time
        localStorage.setItem("personal_ai_key", apiKey);

        statusBox.style.display = "block";
        outputBox.style.display = "none";
        outputBox.innerHTML = "";

        try {
            // New official URL endpoint architecture for the latest model system
            const apiEndpoint = `https://googleapis.com`;
            
            const payload = {
                model: "gemini-3.8-flash",
                input: question
            };

            const webRequest = await fetch(apiEndpoint, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                },
                body: JSON.stringify(payload)
            });

            const rawData = await webRequest.json();

            // Direct extraction based on Google's new system framework layout
            if (rawData.steps && rawData.steps.length > 0) {
                // Look for the output block step inside the response array
                const outputStep = rawData.steps.find(step => step.type === "model_output");
                
                if (outputStep && outputStep.content && outputStep.content[0].text) {
                    let textResult = outputStep.content[0].text;
                    
                    // Format response text with clear presentation tags
                    outputBox.innerHTML = `<strong>AI Response:</strong><br><br>${textResult
                        .replace(/\n/g, "<br>")
                        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")}`;
                    outputBox.style.display = "block";
                } else {
                    outputBox.innerHTML = "⚠️ The AI processed the request but returned no clear text answers.";
                    outputBox.style.display = "block";
                }
            } else if (rawData.error) {
                outputBox.innerHTML = `❌ API Server Error: ${rawData.error.message}`;
                outputBox.style.display = "block";
            } else {
                outputBox.innerHTML = "⚠️ Unexpected response format from the server.";
                outputBox.style.display = "block";
            }
        } catch (err) {
            outputBox.innerHTML = `❌ Browser Connection Error: ${err.message}`;
            outputBox.style.display = "block";
        } finally {
            statusBox.style.display = "none";
        }
    });
</script>

</body>
</html>
