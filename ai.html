<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Cloud AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .ai-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        h1 {
            color: #1a1f36;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #697386;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #3c4257;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #a3acb9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.15s ease;
        }
        textarea {
            resize: vertical;
        }
        input[type="password"]:focus, textarea:focus {
            outline: none;
            border-color: #635bff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #635bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover {
            background-color: #0a2540;
        }
        button:disabled {
            background-color: #a3acb9;
            cursor: not-allowed;
        }
        .status {
            display: none;
            text-align: center;
            color: #635bff;
            font-weight: 600;
            margin-top: 15px;
        }
        .response-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 4px solid #635bff;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="ai-card">
    <h1>My Personal AI</h1>
    <div class="subtitle">Cloud API Connected Engine — Powered by OpenAI</div>

    <div class="input-group">
        <label for="apiKey">🔑 Enter your OpenAI API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-proj-..." />
    </div>

    <div class="input-group">
        <label for="aiQuestion">❓ Ask your AI any question:</label>
        <textarea id="aiQuestion" rows="4" placeholder="Type your question here..."></textarea>
    </div>

    <button id="submitBtn">Ask My AI</button>

    <div id="statusMessage" class="status">⚡ Connecting to cloud brain... Please wait...</div>
    <div id="outputBlock" class="response-container"></div>
</div>

<script>
    document.getElementById("submitBtn").addEventListener("click", async function() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const question = document.getElementById("aiQuestion").value.trim();
        const statusBox = document.getElementById("statusMessage");
        const outputBox = document.getElementById("outputBlock");
        const submitBtn = document.getElementById("submitBtn");

        if (!apiKey) {
            alert("Please enter your OpenAI API key first.");
            return;
        }

        if (!question) {
            alert("Please type a question first.");
            return;
        }

        submitBtn.disabled = true;
        statusBox.style.display = "block";
        outputBox.style.display = "none";
        outputBox.innerHTML = "";

        try {
            const response = await fetch("https://openai.com", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [
                        { role: "system", content: "You are a helpful, concise personal assistant." },
                        { role: "user", content: question }
                    ],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP status ${response.status}`);
            }

            const data = await response.json();
            const aiReply = data.choices[0].message.content;

            outputBox.innerHTML = "<strong>AI Response:</strong><br><br>" + aiReply;
            outputBox.style.display = "block";

        } catch (err) {
            outputBox.innerHTML = "❌ <strong>Error communicating with API:</strong><br>" + err.message;
            outputBox.style.display = "block";
            console.error(err);
        } finally {
            statusBox.style.display = "none";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
