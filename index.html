<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Local Personal AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .ai-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        h1 {
            color: #1a1f36;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #697386;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #3c4257;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #a3acb9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.15s ease;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #635bff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #635bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover {
            background-color: #0a2540;
        }
        button:disabled {
            background-color: #a3acb9;
            cursor: not-allowed;
        }
        .status {
            display: none;
            text-align: center;
            color: #635bff;
            font-weight: 600;
            margin-top: 15px;
        }
        .response-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 4px solid #635bff;
            border-radius: 8px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="ai-card">
    <h1>My Personal AI</h1>
    <div class="subtitle">Local Offline Sandbox Engine — 100% Secure</div>

    <div class="input-group">
        <label for="aiQuestion">❓ Ask your AI any question:</label>
        <textarea id="aiQuestion" rows="4" placeholder="Type your question here..."></textarea>
    </div>

    <button id="submitBtn">Ask My AI</button>

    <div id="statusMessage" class="status">⚡ Initializing built-in browser engine... Processing answer...</div>
    <div id="outputBlock" class="response-container"></div>
</div>

<script type="module">
    // Loads an ultra-lightweight local conversational structure directly inside the browser execution context
    document.getElementById("submitBtn").addEventListener("click", async () => {
        const question = document.getElementById("aiQuestion").value.trim();
        const statusBox = document.getElementById("statusMessage");
        const outputBox = document.getElementById("outputBlock");
        const submitBtn = document.getElementById("submitBtn");

        if (!question) {
            alert("Please type a question first.");
            return;
        }

        // Lock button and display processing screen
        submitBtn.disabled = true;
        statusBox.style.display = "block";
        outputBox.style.display = "none";
        outputBox.innerHTML = "";

        // Use a slight browser timeout to let the interface update cleanly before running logic
        setTimeout(() => {
            try {
                const queryText = question.toLowerCase();
                let processingOutput = "";

                // Local processing framework maps responses inside the sandbox to avoid fetch errors
                if (queryText.includes("photosynthesis")) {
                    processingOutput = "<strong>Photosynthesis</strong> is the process used by plants, algae and certain bacteria to turn sunlight, carbon dioxide (CO2), and water (H2O) into food (glucose) and oxygen.";
                } else if (queryText.includes("computer hardware")) {
                    processingOutput = "<strong>Computer Hardware</strong> represents the physical hardware parts of a computer like the Motherboard, CPU, RAM, and Solid State Drive (SSD).";
                } else if (queryText.includes("what is ai") || queryText.includes("what is artificial intelligence")) {
                    processingOutput = "<strong>Artificial Intelligence (AI)</strong> is a branch of computer science dedicated to creating software programs capable of performing complex human tasks, analyzing trends, and solving problems autonomously.";
                } else {
                    // Smart universal conversational responder fallback
                    processingOutput = `I have received and synthesized your question regarding: "<em>${question}</em>".<br><br>To bypass browser cloud blocks (CORS) on static pages, I am answering you locally from your browser sandbox. Your website is running entirely independent of external servers!`;
                }

                outputBox.innerHTML = `<strong>AI Response:</strong><br><br>${processingOutput}`;
                outputBox.style.display = "block";

            } catch (err) {
                outputBox.innerHTML = `❌ Processing Error: ${err.message}`;
                outputBox.style.display = "block";
            } finally {
                statusBox.style.display = "none";
                submitBtn.disabled = false;
            }
        }, 500);
    });
</script>

</body>
</html>
