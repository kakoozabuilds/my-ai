<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Local Personal AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .ai-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 40px;
        }
        h1 {
            color: #1a1f36;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #697386;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #3c4257;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #a3acb9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.15s ease;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #635bff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #635bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover {
            background-color: #0a2540;
        }
        button:disabled {
            background-color: #a3acb9;
            cursor: not-allowed;
        }
        .status {
            display: none;
            text-align: center;
            color: #635bff;
            font-weight: 600;
            margin-top: 15px;
        }
        .response-container {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 4px solid #635bff;
            border-radius: 8px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="ai-card">
    <h1>My Personal AI</h1>
    <div class="subtitle">Local Offline Sandbox Engine — 100% Secure</div>

    <div class="input-group">
        <label for="aiQuestion">❓ Ask your AI any question:</label>
        <textarea id="aiQuestion" rows="4" placeholder="Type your question here..."></textarea>
    </div>

    <button id="submitBtn">Ask My AI</button>

    <div id="statusMessage" class="status">⚡ Processing locally inside your browser window... Please wait...</div>
    <div id="outputBlock" class="response-container"></div>
</div>

<script>
    document.getElementById("submitBtn").addEventListener("click", function() {
        const question = document.getElementById("aiQuestion").value.trim();
        const statusBox = document.getElementById("statusMessage");
        const outputBox = document.getElementById("outputBlock");
        const submitBtn = document.getElementById("submitBtn");

        if (!question) {
            alert("Please type a question first.");
            return;
        }

        submitBtn.disabled = true;
        statusBox.style.display = "block";
        outputBox.style.display = "none";
        outputBox.innerHTML = "";

        setTimeout(function() {
            try {
                const queryText = question.toLowerCase();
                let answer = "";

                if (queryText.includes("photosynthesis")) {
                    answer = "<strong>Photosynthesis</strong> is the process used by plants, algae, and certain bacteria to harness energy from sunlight and turn it into chemical energy (food).";
                } else if (queryText.includes("hardware")) {
                    answer = "<strong>Computer Hardware</strong> refers to the physical elements that make up a computer system, such as the CPU, RAM, Motherboard, and Storage SSD.";
                } else if (queryText.includes("ai") || queryText.includes("intelligence")) {
                    answer = "<strong>Artificial Intelligence (AI)</strong> is the simulation of human intelligence processes by computer systems, enabling machines to learn, reason, and solve problems.";
                } else if (queryText.includes("population")) {
                    answer = "<strong>Population</strong> refers to the total number of individuals of a specific species (such as humans) living in a particular geographical area context at a given time.";
                } else {
                    answer = "I have successfully processed your question: '<em>" + question + "</em>'.<br><br>Because external cloud traffic is completely blocked by web browser rules on this domain, your query has been handled locally within your browser sandbox window!";
                }

                outputBox.innerHTML = "<strong>AI Response:</strong><br><br>" + answer;
                outputBox.style.display = "block";

            } catch (err) {
                outputBox.innerHTML = "❌ Error processing text: " + err.message;
                outputBox.style.display = "block";
            } finally {
                statusBox.style.display = "none";
                submitBtn.disabled = false;
            }
        }, 300);
    });
</script>

</body>
</html>
